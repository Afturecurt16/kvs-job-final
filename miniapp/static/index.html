<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>KVS Job</title>
    <script>
      (function () {
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=inter:400,500,700,800,900&display=swap" />
    <link rel="preconnect" href="https://st.max.ru" />
    <link rel="preload" href="/assets/images/fin-career-hero.jpg" as="image" />
    <link rel="preload" href="/assets/images/menu_picture.jpg" as="image" />
    <link rel="stylesheet" href="/static/src/styles/main.css" />
    <script>
      // Keep MAX launch data before the bridge or SPA navigation changes the URL fragment.
      (function () {
        var data = new URLSearchParams(window.location.hash.slice(1)).get('WebAppData')
          || new URLSearchParams(window.location.search).get('WebAppData');
        if (!data) return;
        window.KVS_MAX_INIT_DATA = data;
        try { window.sessionStorage.setItem('kvs-job:max-init-data', data); } catch (_) {}
      })();
    </script>
    <script type="module" src="/static/src/app/bootstrap.js"></script>
  </head>
  <body>
    <div id="app" class="app" aria-live="polite">
      <main class="screen">
        <section class="state-card initial-loading" aria-label="Загрузка KVS Job">
          <div class="loading-pulse"></div>
          <strong>Загружаем KVS Job</strong>
          <p>Подготавливаем вакансии и мероприятия.</p>
        </section>
      </main>
    </div>
  </body>
</html>
